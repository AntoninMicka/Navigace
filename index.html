<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TacNav PoC</title>
    <link rel="manifest" href="manifest.json">
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Socket.io klient -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Vlastní styly -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- CRT a Taktický Overlay -->
        <div id="crt-overlay"></div>
        <div id="crosshair">
            <div class="ch-line ch-v"></div>
            <div class="ch-line ch-h"></div>
            <div class="ch-center"></div>
        </div>

        <!-- Systémové logy plovoucí přes mapu -->
        <div id="sys-log">
            <p>[SYS] Inicializace spojení...</p>
        </div>

        <!-- Mapa -->
        <div id="map"></div>
        
        <!-- Boční/spodní panel -->
        <div id="sidebar">
            <!-- Informační / Taktický panel -->
            <div id="panel">
                <div class="panel-header">
                    <h2>TACTICAL INTEL</h2>
                    <div class="header-buttons">
                        <button id="btn-log-toggle">LOG [ON]</button>
                        <button id="btn-locate">[ CENTER ]</button>
                        <button id="btn-compass">COMPASS</button>
                        <button id="btn-hud">HUD [OFF]</button>
                    </div>
                </div>
                <div id="search-screen" class="panel-section">
                    <h3>CIL</h3>
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Zadejte adresu cíle...">
                        <button id="btn-search">HLEDAT</button>
                    </div>
                    <div class="route-actions">
                        <button id="btn-start-nav" disabled>START NAV</button>
                        <button id="btn-stop-nav" disabled>STOP</button>
                    </div>
                </div>
                <div id="intel-screen" class="panel-section">
                    <h3>TELEMETRIE</h3>
                    <label class="field-label" for="asset-type">SYMBOL</label>
                    <select id="asset-type">
                        <option value="person">Pěšák</option>
                        <option value="bicycle">Kolo</option>
                        <option value="motorcycle">Motocykl</option>
                        <option value="car" selected>Auto</option>
                        <option value="hq" data-admin-only>Velitelství</option>
                    </select>
                    <div class="intel-data">
                        <p>STATUS: <span id="status" class="text-green">ONLINE</span></p>
                        <p>LAT: <span id="pos-lat">--</span></p>
                        <p>LON: <span id="pos-lon">--</span></p>
                        <p>SPD: <span id="pos-speed">--</span> km/h</p>
                        <p>HDG: <span id="pos-heading">--</span>°</p>
                    </div>
                </div>
            </div>
        </div>
        <div id="overview-map-container">
            <div id="overview-map"></div>
            <div id="overview-info">
                DIST: <span id="overview-dist">-- km</span> | ETA: <span id="overview-eta">-- min</span>
            </div>
        </div>
        <nav id="mobile-tabs" aria-label="Mobilní navigace">
            <button class="mobile-tab is-active" data-screen="map">MAPA</button>
            <button class="mobile-tab" data-screen="search">CIL</button>
            <button class="mobile-tab" data-screen="intel">INFO</button>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
