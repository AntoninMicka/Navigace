name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west3 # Frankfurt (Změň, pokud nasazuješ jinam)
  SERVICE_NAME: tacnav

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: .
          # Volitelné nastavení prostředí
          env_vars: |
            DISABLE_BACKEND_CACHE=true
          # Parametry pro WebSockets a běh kontejneru
          flags: |
            --allow-unauthenticated
            --no-cpu-throttling
            --session-affinity